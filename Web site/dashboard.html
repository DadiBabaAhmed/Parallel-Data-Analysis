<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Analysis Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .controls { margin-bottom: 12px; }
    #analysis-status { margin-left: 12px; }
  </style>
</head>
<body>
  <h1>Analysis Dashboard</h1>

  <div class="controls">
    <label for="input-file">Input file:</label>
    <select id="input-file"></select>

    <label for="analysis-type">Analysis:</label>
    <select id="analysis-type">
      <option value="full">full</option>
      <option value="statistical">statistical</option>
      <option value="aggregation">aggregation</option>
    </select>

    <button id="start-analysis">Start</button>
    <span id="analysis-status"></span>
  </div>

  <div id="analysis-summary"></div>
  <canvas id="analysis-timeseries" width="900" height="300"></canvas>
  <canvas id="analysis-histogram" width="600" height="250"></canvas>

  <script>
    // small helper to call your API
    async function apiFetch(path, opts) {
      const res = await fetch(path, opts || {});
      if (!res.ok) throw new Error('API error ' + res.status);
      return res.json();
    }

    async function loadInputFiles() {
      try {
        const data = await apiFetch('/api/input-files');
        const sel = document.getElementById('input-file');
        sel.innerHTML = '';
        (data.files || []).forEach(f => {
          const opt = document.createElement('option');
          opt.value = f; opt.textContent = f;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('start-analysis').addEventListener('click', async () => {
      const filename = document.getElementById('input-file').value;
      const analysis = document.getElementById('analysis-type').value;
      const statusEl = document.getElementById('analysis-status');
      try {
        statusEl.textContent = 'Starting...';
        const r = await apiFetch('/api/trigger', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({filename, analysis})
        });
        const jobId = r.job_id;
        statusEl.textContent = 'Job queued: ' + jobId;
        // poll status
        const poll = setInterval(async () => {
          const s = await apiFetch('/api/job/' + jobId);
          statusEl.textContent = 'Job ' + jobId + ': ' + s.status;
          if (s.status === 'finished' || s.status === 'failed') {
            clearInterval(poll);
            // fetch logs & results if finished
            if (s.status === 'finished') {
              // example: load result JSON if available at /api/results/file?category=general&name=...
              // adapt to your result filenames
              statusEl.textContent = 'Job finished';
            } else {
              statusEl.textContent = 'Job failed';
            }
          }
        }, 2000);
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
      }
    });

    window.addEventListener('load', loadInputFiles);
  </script>
</body>
</html>
