[pytest]
# Pytest configuration file for Parallel Data Analysis Framework

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Test paths
testpaths = tests

# Markers
markers =
    unit: Unit tests for individual modules
    integration: Integration tests between modules
    smoke: Smoke tests for basic functionality
    performance: Performance and load tests
    docker: Tests requiring Docker environment
    slow: Tests that take a long time to run
    api: API endpoint tests

# Coverage options
[coverage:run]
source = src
omit = 
    */tests/*
    */setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
